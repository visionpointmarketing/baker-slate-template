<!-- DEMO CONTENT — staging only, never shipped. Reproduces the markup Slate
     renders for a form so the client reviews something realistic and the Slate
     UI overrides in build.css can be checked before deploy.

     Multi-control questions (birthdate, radio groups) follow Slate's own
     rendering: the .form_question div wraps a <fieldset> whose <legend> is the
     question label, with the controls in .form_responses. Slate does not use
     fieldsets as section wrappers, so the sections here are plain headings. -->

<div class="slate-form-area__heading">
    <h1>Request Information</h1>
    <p class="slate-form-area__lede">Tell us a little about yourself and an admissions counselor will be in touch.</p>
</div>

<form class="default" action="#" onsubmit="return false;">
    <h2>About you</h2>
    <div class="form_question form_text">
        <label for="d_first">First name <span class="required">*</span></label>
        <input type="text" id="d_first" name="first" size="30">
    </div>
    <div class="form_question form_text">
        <label for="d_last">Last name <span class="required">*</span></label>
        <input type="text" id="d_last" name="last" size="30">
    </div>
    <div class="form_question form_birthdate form_layout_stacked" data-type="birthdate">
        <fieldset>
            <legend class="form_label">Birthdate <span class="required">*</span></legend>
            <div class="form_responses">
                <select name="d_bday_m" aria-label="Month" autocomplete="bday-month" required>
                    <option value=""></option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <select name="d_bday_d" aria-label="Day" autocomplete="bday-day" required>
                    <option value=""></option>
                    <option>01</option><option>02</option><option>03</option><option>04</option>
                    <option>05</option><option>06</option><option>07</option><option>08</option>
                    <option>09</option><option>10</option><option>11</option><option>12</option>
                    <option>13</option><option>14</option><option>15</option><option>16</option>
                    <option>17</option><option>18</option><option>19</option><option>20</option>
                    <option>21</option><option>22</option><option>23</option><option>24</option>
                    <option>25</option><option>26</option><option>27</option><option>28</option>
                    <option>29</option><option>30</option><option>31</option>
                </select>
                <select name="d_bday_y" aria-label="Year" autocomplete="bday-year" required>
                    <option value=""></option>
                    <option>2012</option><option>2011</option><option>2010</option>
                    <option>2009</option><option>2008</option><option>2007</option>
                    <option>2006</option><option>2005</option><option>2004</option>
                </select>
            </div>
        </fieldset>
    </div>
    <div class="form_question form_email">
        <label for="d_email">Email <span class="required">*</span></label>
        <input type="email" id="d_email" name="email" size="30">
    </div>
    <div class="form_question form_phone">
        <label for="d_phone">Phone</label>
        <input type="tel" id="d_phone" name="phone" size="20">
    </div>
    <div class="form_question form_radio form_layout_stacked" data-type="radio">
        <fieldset>
            <legend class="form_label">Are you a US Citizen or Permanent Resident? <span class="required">*</span></legend>
            <div class="form_responses">
                <ul class="cr">
                    <li class="cr"><input type="radio" id="d_cit1" name="citizen" value="1" required> <label class="inline" for="d_cit1">Yes</label></li>
                    <li class="cr"><input type="radio" id="d_cit2" name="citizen" value="0"> <label class="inline" for="d_cit2">No</label></li>
                </ul>
            </div>
        </fieldset>
    </div>

    <h2>Your interests</h2>
    <div class="form_question form_select">
        <label for="d_program">Program of interest</label>
        <select id="d_program" name="program">
            <option>Select a program</option>
            <option>Business</option>
            <option>Computer Science &amp; Technology</option>
            <option>Education</option>
            <option>Nursing</option>
        </select>
    </div>
    <div class="form_question form_radio form_layout_stacked" data-type="radio">
        <fieldset>
            <legend class="form_label">Start term</legend>
            <div class="form_responses">
                <ul class="cr">
                    <li class="cr"><input type="radio" id="d_t1" name="term"> <label class="inline" for="d_t1">Fall 2027</label></li>
                    <li class="cr"><input type="radio" id="d_t2" name="term"> <label class="inline" for="d_t2">Spring 2028</label></li>
                </ul>
            </div>
        </fieldset>
    </div>
    <div class="form_question form_textarea">
        <label for="d_notes">Anything we should know?</label>
        <textarea id="d_notes" name="notes" rows="4" cols="40"></textarea>
    </div>
    <p>A <a href="#">link inside Slate content</a> renders in Autumn Maple and underlined.</p>
    <button class="default" type="button">Submit</button>
</form>
