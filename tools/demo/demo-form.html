<!-- DEMO CONTENT — staging only, never shipped. Reproduces the markup Slate
     renders for a form so the client reviews something realistic and the Slate
     UI overrides in build.css can be checked before deploy. -->

<div class="slate-form-area__heading">
    <h1>Request Information</h1>
    <p class="slate-form-area__lede">Tell us a little about yourself and an admissions counselor will be in touch.</p>
</div>

<form class="default" action="#" onsubmit="return false;">
    <fieldset>
        <legend>About you</legend>
        <div class="form_question form_text">
            <label for="d_first">First name <span class="required">*</span></label>
            <input type="text" id="d_first" name="first" size="30">
        </div>
        <div class="form_question form_text">
            <label for="d_last">Last name <span class="required">*</span></label>
            <input type="text" id="d_last" name="last" size="30">
        </div>
        <div class="form_question form_email">
            <label for="d_email">Email <span class="required">*</span></label>
            <input type="email" id="d_email" name="email" size="30">
        </div>
        <div class="form_question form_phone">
            <label for="d_phone">Phone</label>
            <input type="tel" id="d_phone" name="phone" size="20">
        </div>
    </fieldset>

    <fieldset>
        <legend>Your interests</legend>
        <div class="form_question form_select">
            <label for="d_program">Program of interest</label>
            <select id="d_program" name="program">
                <option>Select a program</option>
                <option>Business</option>
                <option>Computer Science &amp; Technology</option>
                <option>Education</option>
                <option>Nursing</option>
            </select>
        </div>
        <div class="form_question form_radio">
            <label>Start term</label>
            <ul class="cr">
                <li class="cr"><input type="radio" id="d_t1" name="term"> <label class="inline" for="d_t1">Fall 2027</label></li>
                <li class="cr"><input type="radio" id="d_t2" name="term"> <label class="inline" for="d_t2">Spring 2028</label></li>
            </ul>
        </div>
        <div class="form_question form_textarea">
            <label for="d_notes">Anything we should know?</label>
            <textarea id="d_notes" name="notes" rows="4" cols="40"></textarea>
        </div>
        <p>A <a href="#">link inside Slate content</a> renders navy and underlined.</p>
        <button class="default" type="button">Submit</button>
    </fieldset>
</form>
